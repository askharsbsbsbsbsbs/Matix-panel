<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matix vVERSION</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,ICON">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-bg-main: linear-gradient(135deg, #0a0014, #2d0a4e, #1a0033);
            --color-text-primary: #f3e8ff;
            --color-text-secondary: #c4a7e7;
            --color-accent: #a855f7;
            --shadow-header: 0.125rem 0.125rem 0.5rem #000000, 0 0 20px rgba(168, 85, 247, 0.3);
            --space-sm: 0.5rem;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Ubuntu", system-ui;
            color: var(--color-text-secondary);
            background: var(--color-bg-main);
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1 {
            color: var(--color-text-primary);
            text-shadow: var(--shadow-header);
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: var(--space-sm);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon {
            height: 2.5rem;
        }

        .panel-version {
            align-self: flex-start;
            font-size: large;
            color: var(--color-accent);
        }
    </style>
</head>

<body>
    <div id="error-container">
        <div class="header">
            <img id="header-logo" src="data:image/x-icon;base64,ICON" alt="Matix Logo" width="48" height="48">
            <h1>
                Matix Panel
                <span class="panel-version">
                    vVERSION
                </span>
            </h1>
        </div>

        <div>
            <h2>❌ Something went wrong!</h2>
            <p>
                <b>ERROR_MESSAGE</b>
            </p>
        </div>
    </div>

</body>

</html>
